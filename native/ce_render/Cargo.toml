[package]
name = "ce_render"
version = "0.1.0"
edition = "2021"
description = "Native acceleration for ConsoleEngine.Rendering (PixelArtRenderer.ToAnsiString). L1 PoC."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"   # never unwind across the FFI boundary
