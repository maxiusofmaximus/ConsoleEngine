name: CI

on:
  push:
    branches: [ main, 'fix/**', 'perf/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Restrict GITHUB_TOKEN to read-only — this workflow never writes to the repo.
permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Node 24)

      - name: Setup .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0 (Node 24)
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ConsoleEngine.sln

      - name: Build (Release)
        run: dotnet build ConsoleEngine.sln --configuration Release --no-restore

      # On Linux/macOS the [PtyRenderFact] PTY-content tests run against a real pty;
      # on Windows the vstest host can't render ConPTY content, so those tests self-skip.
      - name: Test (Release)
        run: dotnet test ConsoleEngine.sln --configuration Release --no-build --verbosity normal

  pack:
    name: Pack (dry-run — verify packages build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Node 24)

      - name: Setup .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0 (Node 24)
        with:
          dotnet-version: '8.0.x'

      - name: Restore & build
        run: |
          dotnet restore ConsoleEngine.sln
          dotnet build ConsoleEngine.sln --configuration Release --no-restore

      - name: Pack (verify)
        run: |
          dotnet pack src/ConsoleEngine.Core/ConsoleEngine.Core.csproj           --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Locale/ConsoleEngine.Locale.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Rendering/ConsoleEngine.Rendering.csproj --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Config/ConsoleEngine.Config.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Persistence/ConsoleEngine.Persistence.csproj --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Scenes/ConsoleEngine.Scenes.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.World/ConsoleEngine.World.csproj         --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Animation/ConsoleEngine.Animation.csproj --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Input/ConsoleEngine.Input.csproj         --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Terminal/ConsoleEngine.Terminal.csproj   --configuration Release --no-build
