name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Restrict GITHUB_TOKEN to read-only — this workflow never writes to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ConsoleEngine.sln

      - name: Build (Release)
        run: dotnet build ConsoleEngine.sln --configuration Release --no-restore

      - name: Pack (dry-run — verify packages build)
        run: |
          dotnet pack src/ConsoleEngine.Core/ConsoleEngine.Core.csproj           --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Locale/ConsoleEngine.Locale.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Rendering/ConsoleEngine.Rendering.csproj --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Config/ConsoleEngine.Config.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Persistence/ConsoleEngine.Persistence.csproj --configuration Release --no-build
          dotnet pack src/ConsoleEngine.Scenes/ConsoleEngine.Scenes.csproj       --configuration Release --no-build
          dotnet pack src/ConsoleEngine.World/ConsoleEngine.World.csproj         --configuration Release --no-build
