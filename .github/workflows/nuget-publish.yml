name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ConsoleEngine.sln

      - name: Build (Release)
        run: dotnet build ConsoleEngine.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/ConsoleEngine.Core/ConsoleEngine.Core.csproj           --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Locale/ConsoleEngine.Locale.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Rendering/ConsoleEngine.Rendering.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Config/ConsoleEngine.Config.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Persistence/ConsoleEngine.Persistence.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Scenes/ConsoleEngine.Scenes.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.World/ConsoleEngine.World.csproj         --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
