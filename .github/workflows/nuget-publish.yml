name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

# Restrict GITHUB_TOKEN to read-only — publishing uses NUGET_API_KEY, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  publish:
    name: Pack & publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Node 24)

      - name: Setup .NET 8
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2  # v5.3.0 (Node 24)
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ConsoleEngine.sln

      - name: Build (Release)
        run: dotnet build ConsoleEngine.sln --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/ConsoleEngine.Core/ConsoleEngine.Core.csproj           --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Locale/ConsoleEngine.Locale.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Rendering/ConsoleEngine.Rendering.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Config/ConsoleEngine.Config.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Persistence/ConsoleEngine.Persistence.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Scenes/ConsoleEngine.Scenes.csproj       --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.World/ConsoleEngine.World.csproj         --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Animation/ConsoleEngine.Animation.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Input/ConsoleEngine.Input.csproj         --configuration Release --no-build --output ./artifacts
          dotnet pack src/ConsoleEngine.Terminal/ConsoleEngine.Terminal.csproj   --configuration Release --no-build --output ./artifacts

      - name: Push to NuGet.org
        # Pass the API key as an environment variable, not as a CLI argument.
        # ${{ secrets.* }} interpolation in `run:` embeds the value in the process
        # command line (/proc/<pid>/cmdline); env: passes it via the environment
        # block, which is not visible to other processes on the runner.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
